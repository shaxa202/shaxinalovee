<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f26">
<title>Шахина</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--night:#0f0f26;--pom:#d24b68;--gold:#e9bf7c;--moon:#f1eaf6;--mist:#a29bbd;
--d:'Forum','Times New Roman',serif;--h:'Marck Script','Segoe Script',cursive}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--moon);font-family:var(--d);touch-action:manipulation;user-select:none;-webkit-user-select:none}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 110%,#2a1a45 0%,transparent 60%),radial-gradient(ellipse at 90% -10%,rgba(210,75,104,.25),transparent 55%)}
#fx{position:fixed;inset:0;width:100%;height:100%}

#prog{position:fixed;top:max(10px,env(safe-area-inset-top));left:12px;right:12px;display:flex;gap:5px;z-index:5}
#prog i{flex:1;height:3px;border-radius:3px;background:rgba(241,234,246,.18);overflow:hidden}
#prog i::after{content:"";display:block;height:100%;width:0;background:var(--gold);transition:width .5s}
#prog i.done::after{width:100%}

.slide{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12dvh 8vw;pointer-events:none;visibility:hidden}
.slide.on{visibility:visible;pointer-events:auto}
.t{font-size:clamp(2.2rem,10.5vw,4.2rem);line-height:1.15;max-width:15em}
.t.s{font-size:clamp(1.6rem,7vw,2.6rem);color:var(--moon)}
.w{display:inline-block;opacity:0;transform:translateY(22px) scale(.96);filter:blur(6px);transition:opacity .9s,transform .9s,filter .9s}
.on .w{opacity:1;transform:none;filter:none}
.pom{color:var(--pom)}
.sub{font-family:var(--h);color:var(--gold);font-size:clamp(1.5rem,6vw,2.2rem);margin-top:3rem;opacity:0;transition:opacity 1.6s 2.6s}
.on .sub{opacity:1}
.tip{position:fixed;bottom:max(22px,env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:var(--mist);font-size:.95rem;letter-spacing:.04em;animation:pulse 2.4s infinite;z-index:4;transition:opacity .6s}
@keyframes pulse{50%{opacity:.35}}

/* hold heart */
.heart{width:min(52vw,230px);margin-top:2.6rem;touch-action:none;cursor:pointer;filter:drop-shadow(0 0 18px rgba(210,75,104,.35))}
.heart.beat{animation:beat 1.6s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}
#fin{opacity:0;transition:opacity 2s;margin-top:1.4rem}
#fin.on{opacity:1}
#fin .t{font-size:clamp(1.9rem,8.5vw,3rem)}
#sig{font-family:var(--h);color:var(--gold);font-size:1.9rem;margin-top:1.4rem}

@media(min-width:900px){.t{max-width:18em}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<div id="prog"></div>

<section class="slide">
  <div class="t" style="height:40dvh"></div>
  <div class="sub">это для тебя</div>
</section>

<section class="slide"><p class="t">Я ошибся.</p></section>

<section class="slide"><p class="t s">Я общался с другими девушками. Это было глупо и неправильно.</p></section>

<section class="slide"><p class="t s">Теперь я точно знаю, кто для меня важен. <span class="pom">Ты.</span></p></section>

<section class="slide"><p class="t">Прости меня, <span class="pom">Шахина.</span></p></section>

<section class="slide"><p class="t s">Тебе нужно время — бери его. Я не тороплю.</p></section>

<section class="slide" id="last">
  <p class="t s" id="ask">Зажми сердце</p>
  <svg class="heart" id="heart" viewBox="-4 -4 108 98" aria-label="Зажми сердце">
    <defs><clipPath id="cp"><rect id="cr" x="-4" y="94" width="120" height="100"/></clipPath></defs>
    <path d="M50 85C10 55 0 30 20 14 33 4 46 10 50 22 54 10 67 4 80 14 100 30 90 55 50 85Z" fill="none" stroke="#d24b68" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M50 85C10 55 0 30 20 14 33 4 46 10 50 22 54 10 67 4 80 14 100 30 90 55 50 85Z" fill="#d24b68" clip-path="url(#cp)"/>
  </svg>
  <div id="fin"><p class="t">Я очень сильно тебя люблю.<br><span class="pom">Ты для меня словно целая вселенная</span></p><div id="sig"></div></div>
</section>


<script>

const NAME = "Шахина";

const slides = [...document.querySelectorAll('.slide')], prog = document.getElementById('prog'), tip = document.getElementById('tip');
let cur = -1;
slides.forEach(() => prog.appendChild(document.createElement('i')));
document.querySelectorAll('.t:not(#fin .t)').forEach(el => {
  let d = 0;
  const wrap = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 3) {
      const f = document.createDocumentFragment();
      c.textContent.split(/(\s+)/).forEach(w => {
        if (!w.trim()) { f.append(w); return; }
        const s = document.createElement('span'); s.className = 'w'; s.textContent = w;
        s.style.transitionDelay = (d++ * .16 + .25) + 's'; f.append(s);
      });
      c.replaceWith(f);
    } else if (c.nodeType === 1 && c.tagName !== 'BR') wrap(c);
  });
  wrap(el);
});

function go(i) {
  i = Math.max(0, Math.min(slides.length - 1, i));
  if (i === cur) return;
  cur = i;
  slides.forEach((s, k) => s.classList.toggle('on', k === i));
  [...prog.children].forEach((b, k) => b.classList.toggle('done', k <= i));
  want = i === 0 ? 1 : 0;
  tip.style.opacity = i === slides.length - 1 ? 0 : 1;
  if (navigator.vibrate) navigator.vibrate(12);
}

/* tap left = back, tap right = forward, swipe, keys */
let sx = 0, sy = 0;
addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
addEventListener('pointerup', e => {
  if (e.target.closest('#heart')) return;
  const dx = e.clientX - sx, dy = e.clientY - sy;
  burst(e.clientX, e.clientY);
  if (Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy)) go(cur + (dx < 0 ? 1 : -1));
  else if (Math.abs(dy) > 45) go(cur + (dy < 0 ? 1 : -1));
  else go(e.clientX < innerWidth * .3 ? cur - 1 : cur + 1);
});
addEventListener('keydown', e => {
  if (['ArrowRight', 'ArrowDown', ' '].includes(e.key)) go(cur + 1);
  if (['ArrowLeft', 'ArrowUp'].includes(e.key)) go(cur - 1);
});

/* hold the heart */
const heart = document.getElementById('heart'), cr = document.getElementById('cr');
let hold = false, hp = 0, done = false;
heart.addEventListener('pointerdown', e => { hold = true; heart.setPointerCapture(e.pointerId); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => heart.addEventListener(n, () => hold = false));
function heartTick() {
  if (!done) {
    hp = Math.max(0, Math.min(1, hp + (hold ? .012 : -.02)));
    cr.setAttribute('y', 94 - 98 * hp);
    if (hold && navigator.vibrate && Math.random() < .08) navigator.vibrate(8);
    if (hp >= 1) {
      done = true; heart.classList.add('beat');
      document.getElementById('ask').style.display = 'none';
      document.getElementById('fin').classList.add('on');
      document.getElementById('sig').textContent = FROM;
      if (navigator.vibrate) navigator.vibrate([40, 60, 40]);
      for (let i = 0; i < 6; i++) setTimeout(() => burst(innerWidth / 2, innerHeight * .55, 26), i * 220);
    }
  }
  requestAnimationFrame(heartTick);
}
heartTick();

/* ---- canvas: name in stars + sparks ---- */
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, P = [], S = [], m = 0, want = 1, mouse = {x: -999, y: -999};
const still = matchMedia('(prefers-reduced-motion:reduce)').matches;

function build() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const off = document.createElement('canvas'); off.width = W; off.height = H;
  const o = off.getContext('2d'), fs = Math.min(W * .27, 200);
  o.font = fs + 'px Forum, serif'; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillStyle = '#fff';
  o.fillText(NAME, W / 2, H * .42);
  const d = o.getImageData(0, 0, W, H).data, g = W < 500 ? 4 : 5; P = [];
  for (let y = 0; y < H; y += g) for (let x = 0; x < W; x += g)
    if (d[(y * W + x) * 4 + 3] > 128) P.push({tx: x, ty: y, hx: Math.random() * W, hy: Math.random() * H, r: Math.random() * 1.3 + .6, ph: Math.random() * 6.3, gold: Math.random() < .22});
  for (let i = 0; i < 90; i++) P.push({tx: null, hx: Math.random() * W, hy: Math.random() * H, r: Math.random() + .3, ph: Math.random() * 6.3, vx: (Math.random() - .5) * .15, vy: -Math.random() * .2 - .03});
}
function burst(x, y, n = 14) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = Math.random() * 3 + 1;
    S.push({x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, l: 1, c: Math.random() < .5 ? '210,75,104' : '233,191,124'}); }
}
function frame(t) {
  ctx.clearRect(0, 0, W, H);
  m += (want - m) * (still ? 1 : .035);
  const e = m * m * (3 - 2 * m);
  for (const p of P) {
    const tw = .55 + .45 * Math.sin(t / 800 + p.ph);
    let x, y;
    if (p.tx === null) {
      p.hx = (p.hx + p.vx + W) % W; p.hy = (p.hy + p.vy + H) % H; x = p.hx; y = p.hy;
      ctx.fillStyle = `rgba(241,234,246,${.4 * tw})`;
    } else {
      x = p.hx + (p.tx - p.hx) * e + Math.sin(t / 1200 + p.ph) * (.7 + (1 - e) * 6);
      y = p.hy + (p.ty - p.hy) * e + Math.cos(t / 1000 + p.ph) * (.7 + (1 - e) * 6);
      const dx = x - mouse.x, dy = y - mouse.y, ds = Math.hypot(dx, dy);
      if (ds < 80) { x += dx / ds * (80 - ds) * .3; y += dy / ds * (80 - ds) * .3; }
      ctx.fillStyle = p.gold ? `rgba(233,191,124,${(.5 + .5 * tw) * (.25 + .75 * e)})` : `rgba(241,234,246,${(.6 + .4 * tw) * (.2 + .8 * e)})`;
    }
    ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.283); ctx.fill();
  }
  S = S.filter(s => (s.l -= .018) > 0);
  for (const s of S) { s.x += s.vx; s.y += s.vy; s.vy += .06; s.vx *= .98;
    ctx.fillStyle = `rgba(${s.c},${s.l})`; ctx.beginPath(); ctx.arc(s.x, s.y, 2.2 * s.l + .4, 0, 6.283); ctx.fill(); }
  requestAnimationFrame(frame);
}
const mv = e => { const s = e.touches ? e.touches[0] : e; mouse.x = s.clientX; mouse.y = s.clientY; };
addEventListener('pointermove', mv); addEventListener('pointerleave', () => mouse.x = -999);
addEventListener('resize', build);

(document.fonts ? document.fonts.load('100px Forum', NAME) : Promise.resolve()).catch(() => {}).then(() => {
  build(); m = still ? 1 : 0; requestAnimationFrame(frame); go(0);
});
</script>
</body>
</html>
